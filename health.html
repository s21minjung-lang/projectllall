<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLALL 건강 기록</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="brand">
        LLALL
        <span class="brand-tagline">LETs LIVE A LONG LIFE</span>
      </div>
      <nav class="nav">
        <a class="nav-link" href="index.html">홈으로</a>
        <a class="nav-link active" href="health.html">건강 기록</a>
        <a class="nav-link" href="report.html">칼로리 리포트</a>
        <a class="nav-link" href="health-report.html">건강 리포트</a>
        <a class="nav-link" href="order.html">맞춤 주문</a>
      </nav>
    </header>

    <main>
      <section class="page active">
        <div class="page-header">
          <h2>건강 기록</h2>
          <p>체중, 컨디션, 복약 기록을 한 번에 입력하고 자동 비교 리포트를 확인하세요.</p>
        </div>
        <form class="record-form" id="health-form">
          <label class="form-field">
            <span>체중 입력 (kg)</span>
            <input type="number" step="0.1" min="30" max="200" name="weight" placeholder="예: 62.4" required />
          </label>
          <label class="form-field">
            <span>상태 기록</span>
            <select name="condition" required>
              <option value="">컨디션 선택</option>
              <option value="좋음">좋음</option>
              <option value="보통">보통</option>
              <option value="피곤">피곤</option>
            </select>
          </label>
          <label class="form-field">
            <span>약 복용 기록</span>
            <select name="medication" required>
              <option value="">복용 여부</option>
              <option value="복용 완료">복용 완료</option>
              <option value="부분 복용">부분 복용</option>
              <option value="미복용">미복용</option>
            </select>
          </label>
          <button class="button primary" type="submit">기록 저장하고 비교 보기</button>
        </form>
        <div class="page-actions">
          <a class="button primary" href="health-report.html">건강 리포트 보기</a>
          <a class="button ghost" href="index.html">홈으로</a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>LLALL과 함께 건강한 식단 루틴을 시작하세요.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
