<!DOCTYPE html>

    <header class="top-bar">
      <div class="brand">
        LLALL

      <nav class="nav">

    <main>
      <section class="page active">
        <div class="page-header">
          <h2>추가 샐러드 주문으로 영양 채우기</h2>
          <p>부족한 영양소를 채울 수 있는 LLALL 추천 샐러드입니다.</p>
        </div>
        <div class="order-grid">

            <p>닭가슴살 + 병아리콩 + 두부</p>

          <article class="order-card">

            <p>파프리카 + 케일 + 블루베리</p>
            <span>비타민 A/C + 풍부</span>
          </article>
        </div>
        <div class="page-actions">
          <a class="button primary" href="index.html">홈으로 돌아가기</a>

    <footer class="footer">
      <p>LLALL과 함께 건강한 식단 루틴을 시작하세요.</p>
