<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLALL 건강 리포트</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="brand">
        LLALL
        <span class="brand-tagline">LETs LIVE A LONG LIFE</span>
      </div>
      <nav class="nav">
        <a class="nav-link" href="index.html">홈으로</a>
        <a class="nav-link" href="health.html">건강 기록</a>
        <a class="nav-link" href="report.html">칼로리 리포트</a>

        <a class="nav-link" href="order.html">맞춤 주문</a>
      </nav>
    </header>

    <main>
      <section class="page active">
        <div class="page-header">
          <h2>건강 리포트</h2>
          <p>체중 변화, 컨디션 추세, 복약 성실도를 종합한 주간 리포트입니다.</p>
        </div>
        <div class="report-grid">
          <div class="report-card">
            <h3>체중 변화</h3>
            <p class="metric">-0.8 kg</p>
            <p>균형 식단 유지로 안정적인 감소 추세입니다.</p>
          </div>
          <div class="report-card">
            <h3>컨디션 변화</h3>
            <p class="metric">+15%</p>
            <p>수면 시간 증가로 에너지 지수가 개선되었습니다.</p>
          </div>
          <div class="report-card">
            <h3>복약 성실도</h3>
            <p class="metric">92%</p>
            <p>LLALL 알림으로 꾸준한 복용을 이어가고 있어요.</p>
          </div>
        </div>
        <div class="page-actions">
          <a class="button primary" href="order.html">필요 영양 채우기</a>
          <a class="button ghost" href="health.html">건강 기록으로</a>
        </div>

    <footer class="footer">
      <p>LLALL과 함께 건강한 식단 루틴을 시작하세요.</p>
    </footer>
